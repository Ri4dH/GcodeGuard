[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "gcodeguard"
version = "0.1.0"
description = "A safety firewall for 3D printers: blocks dangerous, sabotaged, or AI-injected G-code before it reaches the machine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Riad-H" }]
keywords = ["3d-printing", "g-code", "security", "firewall", "octoprint", "klipper", "mcp", "llm-agents", "prompt-injection"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Manufacturing",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Printing",
  "Topic :: Security",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
bench = ["anthropic>=0.70"]
media = ["pillow>=10", "matplotlib>=3.8"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mcp>=1.2"]

[project.scripts]
gcodeguard = "gcodeguard.cli:main"

[project.entry-points."octoprint.plugin"]
gcodeguard = "octoprint_gcodeguard"

[project.urls]
Homepage = "https://github.com/Ri4dH/PrintGuard"
Issues = "https://github.com/Ri4dH/PrintGuard/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gcodeguard", "src/octoprint_gcodeguard"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
