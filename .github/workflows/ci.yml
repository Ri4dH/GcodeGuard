name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: pytest --cov=gcodeguard --cov-report=term-missing:skip-covered

  scan-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Clean example passes
        run: gcodeguard scan -p ender3 examples/gcode/cube.gcode
      - name: Tampered example is blocked
        run: |
          set +e
          gcodeguard scan -p ender3 examples/gcode/tampered-cube.gcode
          test $? -eq 2
