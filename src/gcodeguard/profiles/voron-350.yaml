extends: generic-fdm
name: voron-350
description: Voron 2.4 350mm on Klipper (all-metal hotend, enclosed, chamber heater optional).
machine:
  firmware: klipper
  build_volume: {x: [0, 350], y: [0, 350], z: [0, 340]}
  max_hotend_temp: 290
  max_bed_temp: 120
  max_chamber_temp: 65
  max_feedrate_mm_s: 500
  max_accel_mm_s2: 20000
commands:
  allow: [PRINT_START, PRINT_END, CLEAN_NOZZLE, BED_MESH_CALIBRATE, QUAD_GANTRY_LEVEL]
